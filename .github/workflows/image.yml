name: image

# Publishes the container image to GHCR. Runs on main and on version tags; never on
# pull requests, so a fork cannot push an image under this name.
on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # arm64 matters here: a lot of self-hosters run this on a Raspberry Pi.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the amd64 image
        run: |
          docker run -d --name smoke -p 8952:8952 \
            -e TRIVET_USER=ci -e TRIVET_PASS=ci -e TRIVET_SECRET_KEY=ci-secret \
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8952/healthz >/dev/null 2>&1; then
              echo "healthy after ${i}s"; curl -sS http://127.0.0.1:8952/healthz; exit 0
            fi
            sleep 1
          done
          echo "container never became healthy"; docker logs smoke; exit 1
